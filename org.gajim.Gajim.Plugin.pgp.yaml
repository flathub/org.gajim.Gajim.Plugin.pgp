id: org.gajim.Gajim.Plugin.pgp
runtime: org.gajim.Gajim
runtime-version: stable
sdk: org.gnome.Sdk//51
build-extension: true
separate-locales: false
appstream-compose: false

build-options:
  env:
    PIP_TARGET: /app/plugins/pgp/site-packages
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

modules:
  - name: python3-python-gnupg
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation .
    sources:
      - type: archive
        url: https://github.com/vsajip/python-gnupg/archive/refs/tags/0.5.7.tar.gz
        sha512: 6558359e060f3914a321f1161203d4441417e75247344cd527cf3337bbf57379e317fdefefc8457559f2a669c26fbb13eefaa0495abbef85e4303cd91a651f82

  - name: gajim-pgp
    buildsystem: simple
    build-commands:
      - 'cp -R -t ${FLATPAK_DEST} *'
    post-install:
      - install -Dm644 --target-directory=${FLATPAK_DEST}/share/metainfo org.gajim.Gajim.Plugin.pgp.metainfo.xml
      - appstreamcli compose --components=${FLATPAK_ID} --prefix=/ --origin=${FLATPAK_ID}
        --result-root=${FLATPAK_DEST} --data-dir=${FLATPAK_DEST}/share/app-info/xmls ${FLATPAK_DEST}
    sources:
      - type: archive
        strip-components: 0
        url: https://ftp.gajim.org/plugins/master/pgp/pgp_1.9.0.zip
        sha512: cd8385bb561e28fe643f53812acdfb4f37b0d1dfd9496b5522c3ae4b60f8ff3e3c81d6e8d450806879004ea8a41d4485c4040eb0cac3a16eb5c47d7d4b28116e
